[package]
name = "cc-wired-client"
version = "0.1.0"
edition = "2024"

[dependencies]
cc-wired-protocol = { path = "../protocol" }
config = "0.15.25"
env_logger = "0.11.11"
futures-util = "0.3.34"
log = "0.4.34"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "fs", "time"] }
tokio-tungstenite = "0.30.0"
uuid = { version = "1.26.0", features = ["v4"] }
